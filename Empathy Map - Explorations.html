<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Stakeholder Empathy Map · LLO 8230</title>

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400;1,8..60,500;1,8..60,600&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet" />

<link rel="stylesheet" href="styles.css" />

<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #EFEBE3;
    font-family: "Inter Tight", -apple-system, BlinkMacSystemFont, sans-serif; }
  #root { width: 100vw; height: 100vh; }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/pptxgenjs@3.12.0/dist/pptxgen.bundle.js"></script>
</head>
<body>

<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="worksheet-core.jsx"></script>
<script type="text/babel" src="empathy-core.jsx"></script>
<script type="text/babel" src="empathy-v1.jsx"></script>
<script type="text/babel" src="empathy-v2.jsx"></script>
<script type="text/babel" src="empathy-v3.jsx"></script>

<script type="text/babel">
  const { DesignCanvas, DCSection, DCArtboard } = window;

  function App() {
    return (
      <DesignCanvas>
        <DCSection id="empathy" title="Stakeholder Empathy Map"
                   subtitle="Three treatments · same worksheet system · Think & Feel · See · Hear · Say & Do · Pain · Gain · click ⤢ to focus, then Export PDF">
          <DCArtboard id="v1" label="1 · Canvas (classic cross)" width={1920} height={1080}>
            <window.EmpathyMapV1 />
          </DCArtboard>
          <DCArtboard id="v2" label="2 · Portrait (dark panel)" width={1920} height={1080}>
            <window.EmpathyMapV2 />
          </DCArtboard>
          <DCArtboard id="v3" label="3 · Orbit (radial map)" width={1920} height={1080}>
            <window.EmpathyMapV3 />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>

</body>
</html>
